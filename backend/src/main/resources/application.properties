spring.application.name=service-booking-api
server.port=8080

# SQL Server
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:ServiceBookingDB};encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Pass@word1}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

GOOGLE_API_KEY=${GOOGLE_API_KEY:}

# JWT
jwt.secret=${JWT_SECRET:change-me-to-a-secure-256-bit-secret-in-production}
jwt.expiration=86400000
