services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: Pass@word1
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./docker/sqlserver-entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "( /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Pass@word1' -C -Q 'SELECT 1' 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Pass@word1' -Q 'SELECT 1' 2>/dev/null ) && echo healthy"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: ServiceBookingDB
      DB_USERNAME: sa
      DB_PASSWORD: Pass@word1
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlserver_data:
